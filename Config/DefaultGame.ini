; 优先级：资产字段 > 本覆盖表 > 旧档位折中 > 既有兜底；未来迁入资产后自动优先资产。
BiteTimingOverridesByFishDefinitionId=(("RiverPatternFish",(ProbeDurationSeconds=1.5,TrueBiteWindowSeconds=9.0)),("LittleSilverFish",(ProbeDurationSeconds=2.0,TrueBiteWindowSeconds=11.0)),("LittleColorFish",(ProbeDurationSeconds=2.0,TrueBiteWindowSeconds=11.0)),("ForestLongtailFish",(ProbeDurationSeconds=3.0,TrueBiteWindowSeconds=15.0)),("SilvermoonTrout",(ProbeDurationSeconds=3.0,TrueBiteWindowSeconds=15.0)),("LakeGiantShadow",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("PetalFish",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("WindbellFish",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("SaltedFish",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("StinkyFish",(ProbeDurationSeconds=2.0,TrueBiteWindowSeconds=11.0)),("Blackfish",(ProbeDurationSeconds=3.0,TrueBiteWindowSeconds=15.0)),("Loach",(ProbeDurationSeconds=1.5,TrueBiteWindowSeconds=9.0)),("EstuaryBass",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("PufferFish",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("ElectricEel",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("Pike",(ProbeDurationSeconds=3.0,TrueBiteWindowSeconds=15.0)))
; 以下保留 09-14 的旧档位折中：Common 取普通/少见中点，Uncommon/Event 取稀有，Rare 取珍稀。
; 只作未登记鱼种的旧档位回退，不再代表正式16鱼；不翻译资产旧档位。
