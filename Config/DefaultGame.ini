[/Script/Catfishing.CatOnlineSettings]
; WORK-02 当前工程决策：默认新建局使用 8 人好友局。真实 Steam 双账号、邀请加入和多客户端旅行仍由后续验收覆盖，不能由这段静态配置推断。
SessionAccess=FriendsOnly
SessionPublicConnectionLimit=8

; WORK-02 当前重连裁决：只把非主动的 ConnectionLost 保留为同一权威进程内 60 秒准入窗口；过期记录和主动离局都不能静默变成恢复资格。
VoluntaryLeaveRecovery=Disabled
ReconnectRecordTtlSeconds=60
RecoverableFailureMask=1
ExpiredAdmission=Disabled

; WORK-02 Host exit 有界等待：最多等待远端 DestroySession ACK 与最终 Profile Grant ACK 10 秒；超时只推进收口，不伪造 ACK。
HostExitAckTimeoutSeconds=10.0

[/Script/Catfishing.CatRunSettings]
; WORK-02 当前工程决策：先启用一套固定额度的 Run runtime，使 Lake 启动链不再停在未裁策略；正式人数缩放与日长曲线后续用完整配置替换，不能在代码里默推。
bEnableRunRuntime=True
DayLengthSeconds=120.0
QuotaTarget=3
PlayerScalingPolicy=FixedQuotaTarget

; WORK-02 夜晚准入决策：普通夜晚允许新加入者和 60 秒内重连者参与本夜 ready；资格集合仍由 authority GameMode 在入夜时冻结。
NightJoinReadyPolicy=Enabled
NightReconnectReadyPolicy=Enabled

; WORK-02 成功结算决策：第 10 天达成额度后才允许进入成功结算夜；StateTree 资产仍负责选择具体转移边。
SuccessSettlementPolicy=Enabled
FinalDayIndex=10

[/Script/Catfishing.CatEnvironmentSettings]
; WORK-03 当前工程决策：环境时间与天气只消费局内服务器时钟，不读现实时间；先用固定晴天切片打通快照，后续天气调度用完整配置替换。
bEnableEnvironmentRuntime=True
ConfiguredWeather=Clear
MorningEndFraction=0.25
DuskStartFraction=0.75

; WORK-03 自然事件保持默认关闭：飞书要求事件少而精、频率待数值，不能把聚鱼时刻做成每局常驻。具体事件由后续内容配置显式开启。

