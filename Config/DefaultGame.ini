CommonPerfectFishStrengthMultiplier=0.8
CommonPerfectFishStaminaMultiplier=0.85
RarePerfectFishStrengthMultiplier=0.85
RarePerfectFishStaminaMultiplier=0.9
; 珍稀四鱼已从旧 Rare 迁入 VeryRare；巨影现为 Rare，继续采用普通削减。
+RarePerfectHookRarityTierIds=VeryRare
; 完美线长系数（完美中鱼时初始线长再乘它），不按稀有度分档。
; 2026-09-14 李前臻授权暂定 0.9：四份 Bite_*.uasset 的历史值 0.95/0.85/0.85/0.9 已解出，
; 算术平均 0.8875，按设计一贯的 0.05 粒度取 0.9。依据与改数流程见参数页「线长与收鱼」行。
