BiteTimingDefaultsByRarityTier=(("Common",(ProbeDurationSeconds=1.5,TrueBiteWindowSeconds=9.0)),("Uncommon",(ProbeDurationSeconds=2.0,TrueBiteWindowSeconds=11.0)),("Rare",(ProbeDurationSeconds=2.5,TrueBiteWindowSeconds=13.0)),("VeryRare",(ProbeDurationSeconds=3.0,TrueBiteWindowSeconds=15.0)))
; 测试版先保留时段/天气候选门但不改变出鱼；内容和联机验收通过后只需开启对应开关。
; T23：开启后 TimeOfDay/Weather 空数组＝缺配拒绝并 Warning；不可把缺值当不限。
; 开启节点仍待策划给（D-31），保持 False；基础池空配置同样拒绝。
bEnableTimeOfDayEligibilityFilter=False
bEnableWeatherEligibilityFilter=False
; 无窝料基础池（鱼表格子表「基础池」）：空窝、候选为空或总权重为零时从这里抽一条。
; 2026-09-14 李前臻把子表四条概率由「占位」提为暂定正式值（设计修改记录 2026-09-14 ①④），
; 和为 1.0，本处照抄子表；臭臭鱼留在池内。改数先改子表再改这里。
; 基础池使用数字总表编号；成员与批准概率保持不变。
+BasePool=(ItemId=30,Probability=0.4)
+BasePool=(ItemId=22,Probability=0.3)
+BasePool=(ItemId=23,Probability=0.2)
+BasePool=(ItemId=39,Probability=0.1)
; 食性 → 段末向外概率 P_base。三个数只出现在「鱼的行为」页，而该页页头写明「待整页重写，实现不读本页」，
; 也没有进裁决账本，因此保持未裁（0）＝食性列读得到但不改变行为，鱼按测试期性格模板跑。
; 落到账本之后在这里填 (0,1) 内的值即可启用，代码与资产都不用再改。
CarnivoreOutwardSegmentProbability=0.0
OmnivoreOutwardSegmentProbability=0.0
HerbivoreOutwardSegmentProbability=0.0
