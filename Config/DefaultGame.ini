[/Script/Catfishing.CatFishingSettings]
; 钓鱼 runtime 总开关：本段此前整段缺失，IsRuntimeReady 恒 false，任何钓鱼会话都启动不了。
bEnableFishingRuntime=True
; 单次钓鱼会话的 StateTree 资产，与 ST_RunFlow 同一个 Commandlet 生成。Probe 等满咬钩间隔进 TrueBiteWindow；真咬期钓手第一次"拖"（提竿，1 秒内=完美中鱼）发 HookSet 事件进 HookedFight，没提竿 10 秒到点也进；
; HookedFight 由搏斗任务按飞书 4.3 判定表 / 4.4 消耗战 / D-L 模型逐帧推进：碾压/翻肚/遛到岸边进 NearShore，断竿/拖下水进 Terminated；
; NearShore 停留 30 秒等任何合法玩家抢抄（飞书钓鱼规则 §5 已裁：翻肚鱼 30 秒无人处置就苏醒逃跑），超时进 Terminated；近岸目标由服务器按钓手位置取水域 AABB 最近点（v0 近似，见 Docs/Development/工程自补决策记录.md D-12）。
; 仍没有失败预算（丢饵）节点。
FishingSessionStateTree=/Game/Catfishing/StateTree/ST_FishingSession.ST_FishingSession
; NearShore 几何校验 gate 打开：抢抄只认服务器水域包围盒内的权威目标。
bEnableNearShoreValidation=True
; 可抄距离：飞书钓鱼规则已裁决"全局固定 1 米，不随抄网变化"，折合 100 厘米。
ScoopReachCentimeters=100.0
; 真咬普通响应窗：工程暂定值。飞书给的是"按鱼种 8~15 秒，数值待调"，这里取区间中值占位；正式值应按鱼种配置（鱼定义目前没有这一列），
; 且飞书另有 1 秒完美响应窗，代码里还没有对应字段。见 Docs/Development/工程自补决策记录.md D-10。
TrueBiteWindowSeconds=10.0
