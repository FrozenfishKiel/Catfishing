

[/Script/EngineSettings.GameMapsSettings]
; 编辑器开发期直接停在 Lake：按 Play 就进玩法场景，不再先过 Frontend 的建房/加入流程。
; 这只影响编辑器，打包运行仍从 GameDefaultMap（Frontend）进入正式组局；
; 直达 Lake 的准入由 GameMode 的 PIE 无会话 gate 负责（服务器保留身份类型，客户端伪造会被拒）。
EditorStartupMap=/Game/Catfishing/Maps/Lake
GameDefaultMap=/Game/Catfishing/Maps/Frontend
; WORK-02 Dedicated Server 直接承载 Lake 权威流程；Frontend 只属于本地客户端组局入口。
ServerDefaultMap=/Game/Catfishing/Maps/Lake


[/Script/Engine.GameEngine]
; WORK-02 Steam 联机运行配置：GameNetDriver 使用 SteamNetDriver，失败时回退 IpNetDriver；这只接网络驱动，不改变 Online/Run 的会话和旅行裁决。
+NetDriverDefinitions=(DefName="GameNetDriver",DriverClassName="/Script/OnlineSubsystemSteam.SteamNetDriver",DriverClassNameFallback="/Script/OnlineSubsystemUtils.IpNetDriver")

[/Script/OnlineSubsystemSteam.SteamNetDriver]
; WORK-02 SteamNetDriver 连接类型必须与 Steam 驱动配套；否则会话可发现但客户端连接仍可能走错误 NetConnection。
NetConnectionClassName="/Script/OnlineSubsystemSteam.SteamNetConnection"

