; 项目级编辑器默认设置：让每个人（含 Codex 的测试环境）拿到同一套开发期行为，
; 而不是各自在 Editor Preferences 里手动点一遍。这里的设置只影响编辑器，不进打包。

[/Script/UnrealEd.LevelEditorPlaySettings]
; 按 Play 时从关卡里的 PlayerStart 出生，而不是从"编辑器视口相机当前位置"出生。
; 默认的 PlayLocation_CurrentCameraLocation 会在按 Play 的瞬间就地生成一个 PlayerStartPIE，
; 于是角色出生在你上一次拖视口时相机停的地方——实测过一次相机悬在水面上方 4000 单位，
; 结果角色直接从天上掉进 River 水域里，看起来像"出生点摆错了"，其实关卡是对的。
; 固定成 DefaultPlayerStart 之后，PIE 的出生位置才和打包运行一致，玩法验收才有意义。
LastExecutedPlayModeLocation=PlayLocation_DefaultPlayerStart
