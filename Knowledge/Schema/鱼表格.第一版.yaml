# 鱼表格「第一版」列级发布映射（人维护；不在飞书镜像里，导出脚本不碰它）
#
# 读者：程序（接鱼表时按 publish 取列）、数值属主（改列先改这里的声明）、game-toolkit 的内容层检查。
# 口径来自插件 split-doc-layers/examples/content-model/README.md「来源与发布声明」：
#   每列先分 declarative（机械可校验）/ interpretive（要人读、要语义校验、必须写 owner），
#   再写它发布到 UCatFishDefinition 的哪个字段；发不出去的写 excluded 并说明原因。
# 校验脚本：Scripts/check_fish_table_vs_definition.py（文本级，不开引擎）。

schema_version: table-sidecar/1

table:
  title: 鱼表格
  sheet_name: 第一版
  wiki_node_token: DKhnweGaEiPTJZkO8OScQOJenqg
  spreadsheet_token: CQlMsQon6hlo8ctpZRWcAPzOnRi
  sheet_id: R7rRBp
  mirror: Knowledge/Design/GDD 系统分册/鱼/鱼表格/第一版.csv   # SSOT 2026-09-11 迁进本仓库，路径相对工程根
  manifest: Knowledge/Design/_manifest.json
  identity_column: fish_id            # 资产文件名；运行身份从对应资产读回并保留
  declared_at_revision: 872           # 写本文件时的表 revision；表改列序不影响本文件（按列名对；09-09 晚 fish_id 已移到首列、「金钱系数」列在力量系数 K 旁；09-10 加「最近冲岸距离」列与两张子表）
  header_row: 1
  data_rows: 2-17                     # 16 条鱼；空行不算
  related_sheets:                     # 同一 spreadsheet 里的子表，2026-09-10 建，占位、张佳定；未进发布映射
    - {title: 饵权重, sheet_id: CekBpa, note: 每鱼×每饵权重，目标饵 3、其余 1；抽鱼第二步（鱼册 §3.1.4）}
    - {title: 基础池, sheet_id: rdnjT9, note: 无窝料基础池成员与概率（鱼册 §3.1.2）}

publish_target:
  class: UCatFishDefinition
  header: Source/Catfishing/Data/CatFishDefinition.h
  asset_dir: Content/Catfishing/Data/Fish
  asset_name_rule: "<fish_id>.uasset"
  input_package: .harness/formal-fish-asset-input-package.json   # 记录资产按哪个表 revision 生成

# 权属按字段组，不用单值 content_truth（README 的 Catfishing 示例落到实处）
field_groups:
  - id: identity
    owner: 工程（技术维护者）与鱼册属主共管：ID 由工程定，名字由鱼册定
    columns: [fish_id, 名字]
    reads: [{source: feishu-sheet, locator: 第一版!fish_id/名字, version: sheet-revision}]
    resolution: fish_id 定位资产文件；FishDefinitionId 是运行与存档身份，由迁移脚本显式映射并保留；名字只作展示
  - id: balance
    owner: 数值属主（参数页挂号表：鱼表格属主张佳；数值由李前臻拍）
    columns: [重量/KG, 力量系数K, 体力系数, 经验系数, 稀有度, 需求窝料属性, 偏好饵, 出现地点, 可捞圈半径]
    reads: [{source: feishu-sheet, locator: 第一版!各列, version: sheet-revision}]
    resolution: 只从接受的表快照读；UE 资产里这些字段是生成投影，不得反向手改
  - id: behavior-snapshot
    owner: 钓鱼系统属主（钱成澔）；数值待模拟
    columns: [食性, 发力段长, 休息段长, 游速系数]
    reads: [{source: feishu-sheet, locator: 第一版!各列, version: sheet-revision}]
    resolution: 三个数值列已写入资产并由 CatFishBehaviorProfileResolver 覆盖模板；食性已迁但概率未裁，基速/横切仍暂用 Fight 模板，见 Docs/FishFightImplementationGuide_zh-CN.md
  - id: presentation-text
    owner: Interface（张佳）
    columns: [特点, 图鉴描述, 吃鱼效果, 限时Buff, 持续时间, 鱼刚咬饵时鱼漂的变化, 鱼刚咬饵时水面的变化, 与猫搏斗时鱼的动作变化, 与猫搏斗时水面的变化]
    reads: [{source: feishu-sheet, locator: 第一版!各列, version: sheet-revision}]
    resolution: 自由文本，程序不解析；其中 吃鱼效果/限时Buff/持续时间 三列当前是「人翻译成 FoodSafety 与 buff 资产」，这是缺口，见 columns 里的 gap
  - id: bindings
    owner: 工程（技术维护者）
    columns: []                       # 表里没有这些列，全在资产里
    fields: [Thumbnail, PresentationDefinition, BitePersonalityId, FightPersonalityId, RegionIds, TimeOfDay, Weather, CaptureImprintEventId, bEnableRuntimeDefinition, bTankDisplayEligible]
    reads: [{source: ue-assets, locator: Content/Catfishing/Data/Fish/*.uasset, version: git-commit}]
    resolution: 从接受的 UE 资产快照读；飞书同名栏位只能作提案

# 逐列声明。name 按表头前缀匹配（表头后面常带括注）。
columns:
  - name: fish_id
    classification: declarative
    type: id
    publish: excluded
    note: 2026-09-14 更正：本列是资产文件名（Fish_RiverPattern），资产内部的 FishDefinitionId 是另一套（RiverPatternFish），代码按内部 ID 查表。迁移脚本必须做这一层映射，不能把本列当 FishDefinitionId 直接写配置——2026-09-14 往 BasePool 填包名就抽不出鱼。两套标识归张佳的鱼资产迁移收口
  - name: 名字
    classification: declarative
    type: string
    publish: DisplayName
  - name: 特点
    classification: interpretive
    owner: Interface
    type: text
    publish: excluded
    note: 作者备注，不进资产
  - name: 吃鱼效果
    classification: interpretive
    owner: Framework
    type: text
    publish: excluded
    gap: 代码用 FoodSafety（Unset/Safe/SevereToxic/Inedible）+ EatingTimedEffect + EatingExperiencePerKilogram 表达，全靠人从这列翻译；
      不可食用档 2026-09-12 已加（咸鱼、巨影走 Inedible，经验系数与 YellowStaminaGrant 都必须为 0）；本列里的投掷规格另落 ThrowEffect，两者是两件事
  - name: 出现地点
    classification: declarative
    type: enum
    values: {河流: River, 森林湖: ForestLake}
    publish: RegionIds
    gap: 工程正式地图目前只有 River 一个水域，ForestLake 未建（对表「环境与氛围」高）
  - name: 重量/KG
    classification: declarative
    type: range
    unit: kg
    format: "min~max"
    publish: [MinimumWeightKilograms, MaximumWeightKilograms]
  - name: 力量系数K
    classification: declarative
    type: number
    publish: FishStrengthPerKilogram
    note: 2026-09-15 已迁16鱼，选鱼仅按逐鱼K乘冻结重量；猫方换算系数不再兜底鱼力量
  - name: 体力系数
    classification: declarative
    type: number
    publish: FishFightStaminaPerKilogram
    transform: "初始体力 = 体力系数 × 实际重量（钓鱼规则 v1.5 §4.1）；代码口径已改为系数（字段 2026-09-12 由 FishFightStamina 改名）"
    migration: 2026-09-15 已迁16鱼并独立重载；旧定额折算及开关删除
    note: 2026-09-08 改口径，16 行为占位（原定额÷重量中点），正式值走模拟
  - name: 可捞圈半径
    classification: declarative
    type: number
    unit: cm
    publish: ScoopTargetRadiusCentimeters
    note: 2026-09-09 李前臻裁「可抄几何按代码、逐鱼配圆」后加列；16 行占位按体重档 小 60／中 90／大 120，湖心巨影 0＝不可抄，正式值待调；2026-09-15 已迁并独立重载核验；数值仍属于待试玩校准值
  - name: 最近冲岸距离
    classification: declarative
    type: number
    unit: 米
    publish: excluded
    gap: 代码无对应字段；意图模型结构由钱成澔定后再对（参数页「贴岸阀」行）
    note: 2026-09-10 Claude 建列，按参数页贴岸阀行快照填：食肉中鱼与湖心巨影 1.5、其余 0；衔接待钱成澔确认，正式值随「鱼的行为」方案定
  - name: 金钱系数
    classification: declarative
    type: number
    unit: 金币/公斤
    publish: excluded
    note_runtime: 现有DT_CatFishSalePrices按内部鱼ID保存MoneyCoefficient；2026-09-15只读核对16鱼与本列全部一致，保留原售鱼权威链
    note: 2026-09-09 晚李前臻加列（初名「售价」，同晚改名并挪到力量系数 K 旁），逐鱼每公斤单价，16 行已填齐；商店册体重档收购价表随之作废
  - name: 图鉴描述
    classification: declarative
    type: text
    publish: Description
    note: 文案即值（玩家看到的原文），所以是声明性；改文案走鱼册属主
  - name: 需求窝料属性
    classification: declarative
    type: enum
    values: {腥: Fishy, 香: Fragrant, 酵: Fermented}
    publish: ChumPreference
    transform: "单值枚举 → FCatChumVector 三分量（命中项 1.0，其余 0）；混合配比表里没有"
  - name: 限时Buff
    classification: interpretive
    owner: Framework
    type: text
    publish: excluded
    gap: buff 定义在吃鱼效果页与代码 buff 资产，本列只是快照文案；缺一列 buff_id
  - name: 持续时间
    classification: declarative
    type: number
    unit: 秒
    format: "N秒"
    optional: true                    # 一次性 buff 与无 buff 的鱼留空；写「无」算填错，统一留空
    publish: excluded
    gap: 与 限时Buff 同一缺口，随 buff_id 一起发布
  - name: 经验系数
    classification: declarative
    type: number
    publish: EatingExperiencePerKilogram
    transform: "经验 = 经验系数 × 实际重量（2026-09-07 拍）；代码口径已改为系数（字段 2026-09-12 由 EatingExperience 改名）"
    migration: 2026-09-15 已迁16鱼系数，保留既有成长消费者的连续经验输入
  - name: 偏好饵
    classification: declarative
    type: enum
    values: {虫虫饵: BugBait, 肉块饵: MeatBait, 果实饵: FruitBait, 花蜜饵: NectarBait, 月光饵: MoonlightBait}
    publish: BaitWeightMultipliers
    transform: "以同目录饵权重.csv为准，五种正式饵按资产内部ID写入BaitWeightMultipliers；未列旧饵中性1"
  - name: 稀有度
    classification: declarative
    type: enum
    values: {普通: Common, 少见: Uncommon, 稀有: Rare, 珍稀: VeryRare}
    enum_order: [普通, 少见, 稀有, 珍稀]   # 低→高；完美削减「最高一档」＝珍稀（钓鱼规则 §4.3）
    publish: RarityTierId
    note: 2026-09-15 已迁；湖心巨影 Rare 取普通完美削减，最高档 VeryRare 四鱼取稀有削减。旧 Event 不再用于正式资产
  - name: 食性
    classification: declarative
    type: enum
    values: {食肉: Carnivore, 杂食: Omnivore, 素食: Herbivore}
    publish: Diet
    gap: 字段已加（ECatFishDiet），但食性→P_base 的三个档值仍未裁——「鱼的行为」页标了「实现不读本页」、也没进账本；
      代码留了 CatFishCatalogSettings 的三个概率配置位，未填时行为退回测试期性格模板
  - name: 发力段长
    classification: declarative
    type: range
    unit: 秒
    publish: OutwardSegmentDurationRangeSeconds
    transform: "区间 X=下限、Y=上限；未填（X<=0 或 Y<X）时该列退回 Fight_* 测试模板的 OutwardDurationRangeSeconds"
  - name: 休息段长
    classification: declarative
    type: range
    unit: 秒
    publish: RestSegmentDurationRangeSeconds
    transform: "同上，对应模板的 EaseOffDurationRangeSeconds；横切段（LateralArc）不在设计的两段模型里，段长仍读模板"
  - name: 游速系数
    classification: declarative
    type: number
    publish: SwimSpeedCoefficient
    transform: "本鱼满力游速 = Fight_* 模板的 FullEffortMovementSpeedCentimetersPerSecond × 本系数；0=未填，等价于系数 1"
    note: 2026-09-10 李前臻定按鱼种、本列为准，表头同改；参数页与鱼的行为页的「按体重档 0.8/1.0/1.2/1.5」作废，原一致性矛盾 10 关闭
  - name: 鱼刚咬饵时，鱼漂的变化
    classification: interpretive
    owner: Interface
    type: text
    publish: excluded
    note: 演出文案，进 PresentationDefinition.BiteBobberCue 由人配（槽位 2026-09-12 已开，VFX 资产未做）
  - name: 鱼刚咬饵时，水面的变化
    classification: interpretive
    owner: Interface
    type: text
    publish: excluded
    note: 同上，落 PresentationDefinition.BiteWaterSurfaceCue
  - name: 与猫搏斗时，鱼的动作变化
    classification: interpretive
    owner: Interface
    type: text
    publish: excluded
  - name: 与猫搏斗时，水面的变化
    classification: interpretive
    owner: Interface
    type: text
    publish: excluded
    note: 落 PresentationDefinition.FightWaterSurfaceCue（槽位 2026-09-12 已开，VFX 资产未做）
  - name: 试探期
    classification: declarative
    type: number
    publish: ProbeDurationSeconds
    note: 2026-09-14 李前臻授权暂定，按稀有度档给（普通 1.5／少见 2.0／稀有 2.5／珍稀 3.0）；出处钓鱼规则 §3.4，未填才落 2~4 秒随机兜底；待试玩校准
  - name: 真咬响应窗
    classification: declarative
    type: number
    publish: TrueBiteWindowSeconds
    note: 2026-09-14 李前臻授权暂定，按稀有度档给（普通 9／少见 11／稀有 13／珍稀 15）；设计区间 8~15 见钓鱼规则 §3.4:141；待试玩校准

# 代码有、表里没有的字段：谁定值、要不要在表里加列
code_only_fields:
  FightBodyGeometry: 鱼体几何，独立于数值表；Scripts/calibrate_fish_body_geometry.py 沿 PresentationDefinition 的参考 Mesh 与 EncounterTransform 标定静态嘴点、近似质心、缩放原点和偏航回转半径，Actor 局部厘米、VisualScale=1，运行时按本场比例缩放；数值表迁移不写本字段
  YellowStaminaGrant: 逐鱼食用的一次性黄色体力赠送，单位点；不可食用鱼必须为0，现有四鱼赠送资产保持，本轮不重复迁移
  FishDefinitionId: 资产内部稳定 ID（RiverPatternFish／Loach／StinkyFish…），代码一律按它查表，配置里的 BasePool 等清单也用它。表里 fish_id 列装的是资产文件名（Fish_RiverPattern），两者不同名，迁移脚本必须做映射。2026-09-14 发现：往 BasePool 填包名会抽不出鱼。2026-09-15 按用户保留建议固定保留内部ID，迁移报告输出文件名映射
  bEatingTimedEffectConfigured: 属主确认食用限时 GE 绑定的显式标记；False 为迁移缺口，True 且空 GE 表示确认无效果
  EatingTimedEffect: T02 每鱼独立限时 GameplayEffect 类，Condition 进食提交后由 ASC 应用；同鱼刷新、异鱼并存；正式 GE/GameplayCue 绑定待钱成澔与张佳
  EatingTimedEffectDurationSeconds: T02 食用 GE 基础秒数，应用时乘成长时长倍率；不覆盖猫神祝福，正式绑定未迁移
  FishStrength: 已 Deprecated；输入包仍列为必填字段，说明输入包晚于 D-20/D-21 的改动，重生成时要去掉
  FoodSafety: Unset/Safe/Toxic/Inedible 四档，由 吃鱼效果 文案人工翻译；不可食用档 2026-09-12 已加
  ThrowEffect: 逐鱼投掷效果（Kind/半径/时长/ReactionMontage），由 吃鱼效果 列里写成投掷规格的那两行人工翻译（咸鱼击退炸毛、臭臭鱼驱散）；半径与时长未裁、正式猫反应 Montage 未绑定；CatFishPickupActor 命中后接 CatFishThrowEffectActor，缺配拒绝并 Warning
  BodyClass: 由 名字 是否为湖心巨影推出（Standard/Giant）；可不加列
  SacrificeContribution: 设计按实际体重档取（参数页供奉值行），不该是定额字段；对表已列为待办
  CaptureImprintEventId: 印记触发清单归印记册，不进鱼表
  SpawnWeight: 仅保留旧反射载荷，2026-09-15 已退出选择器和就绪门；二进制外部引用未穷举，暂不删字段
  TimeOfDay: T23 逐鱼时段数据待张佳；开关 D-31 保持关闭，开启后空数组拒绝并 Warning，基础池同样遵循
  Weather: T23 逐鱼天气数据待张佳；开关 D-31 保持关闭，开启后空数组拒绝并 Warning
  MinimumFightParticipants: 设计「单人局不出需要多人的鱼」，巨影=多人；可由 BodyClass 推出
  BitePersonalityId: T10 退为旧资产反射兼容；生产三窗口不再读取 Bite 模板，正式资产待终版统一迁移
  FightPersonalityId: 四套 Fight_* 仍作为现有搏斗链及未填行为字段的测试兜底；D-30 与未审鱼行为页本轮不切换
  PoisonIncrease: 从 吃鱼效果 文案人工翻译；缺结构化列
  bTankDisplayEligible: 工程开关
  bEnableRuntimeDefinition: 工程开关
  Thumbnail: 资产绑定
  PresentationDefinition: 资产绑定

editor_backflow: 未接。资产字段被人在编辑器里改了不会回到表；表格声明的数值先改表再重生成（README 的三方合并链条尚不存在）；FightBodyGeometry 来自参考模型，改模型或 EncounterTransform 后另跑标定与只读验证，不回写鱼表

# 窗口/时段天气接收脚本与正式数据迁移入口；基础池按已批准四成员配置。
runtime_migration_receiver:
  script: Scripts/prepare_fish_runtime_migration.py
  outputs: Saved/Migration/Batch7C/fish-runtime-patch.json
  editor_import: import_into_editor_memory（仅改已加载对象，不保存 Content，先校验全体稳定身份）
  optional_columns: {试探期: ProbeDurationSeconds, 真咬响应窗: TrueBiteWindowSeconds, 时段: TimeOfDay, 天气: Weather}
  base_pool: 已批准的 fish_id/权重专表映射到 CatFishCatalogSettings.BasePool 的 FishDefinitionId/Probability；拒绝占位列、未知ID、重复ID、非正及非有限权重
  base_pool_owner: 张佳
  applied: 两步选类/饵倍率抽鱼、16鱼K/体力/经验/行为数值/窗口/四档稀有度已迁移
  data_migrator: Scripts/migrate_fish_design_data.py
  verification: Saved/FishAlignment/fish-data-verified.json
  deferred: D-31 时段天气开启节点、未审鱼行为、正式GE和投掷资源仍待交付
